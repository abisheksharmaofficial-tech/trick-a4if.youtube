name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          set -e
          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/tools/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web assets
        run: npm run build

      - name: Prepare Capacitor Android project
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi
          if [ -f scripts/configure-android-build.js ]; then
            node scripts/configure-android-build.js
          fi
          if [ -f android-native/MainActivity.kt ]; then
            TARGET_ACTIVITY=$(find android/app/src/main -name "MainActivity.kt" | head -n 1 || true)
            if [ -z "$TARGET_ACTIVITY" ]; then
              if [ -d android/app/src/main/kotlin ]; then
                TARGET_ACTIVITY="android/app/src/main/kotlin/tricka4if/youtube/MainActivity.kt"
              else
                TARGET_ACTIVITY="android/app/src/main/java/tricka4if/youtube/MainActivity.kt"
              fi
              mkdir -p "$(dirname "$TARGET_ACTIVITY")"
            fi
            cp android-native/MainActivity.kt "$TARGET_ACTIVITY"
          fi
          npx cap sync android

      - name: Assemble Debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trick-a4if-youtube-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
